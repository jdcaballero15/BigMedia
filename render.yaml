# Dos entornos:
#   - producción: rama `main`. Hoy en plan gratis; el paso a plan pago con copias de seguridad lo hace
#     Juan a mano en el dashboard de Render (subir el `plan` de `bigmedia-db` y `bigmedia-web`), para
#     no disparar gasto al sincronizar el Blueprint. Ver docs/operacion/despliegue-render.md.
#   - staging: rama `develop`, plan gratis, con datos de ejemplo (nunca datos reales).
# Límites del plan gratis: la web se duerme tras 15 minutos sin tráfico y la base vence a los 30 días.
databases:
  - name: bigmedia-db
    plan: free
    region: virginia
    postgresMajorVersion: '17'
    ipAllowList: []
  - name: bigmedia-db-staging
    plan: free
    region: virginia
    postgresMajorVersion: '17'
    ipAllowList: []

services:
  - type: web
    name: bigmedia-web
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health/
    # El plan gratis no admite preDeployCommand: la imagen migra al arrancar (backend/arrancar.sh).
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bigmedia-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: 'false'
      # Render los pide al crear el Blueprint; nunca se guardan en Git.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: bigmedia-web-staging
    runtime: docker
    plan: free
    region: virginia
    branch: develop
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bigmedia-db-staging
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # `staging` endurece la seguridad como producción y carga datos de ejemplo al arrancar.
      - key: DJANGO_ENV
        value: staging
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
