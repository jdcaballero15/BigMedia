# Recursos de producción en el plan gratis de Render, mientras se valida el sistema.
# Límites: la web se duerme tras 15 minutos sin tráfico y la base gratis vence a los 30 días.
# Ver docs/operacion/despliegue-render.md antes de conectarlo y para pasar al plan pago.
databases:
  - name: bigmedia-db
    plan: free
    region: virginia
    postgresMajorVersion: '17'
    ipAllowList: []

services:
  - type: web
    name: bigmedia-web
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health/
    # El plan gratis no admite preDeployCommand: la imagen migra al arrancar (backend/arrancar.sh).
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bigmedia-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: 'false'
      # Render los pide al crear el Blueprint; nunca se guardan en Git.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
