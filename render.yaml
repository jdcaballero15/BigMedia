# Production resources. Applying this Blueprint creates paid services.
# See docs/operacion/despliegue-render.md before connecting it to Render.
databases:
  - name: bigmedia-db
    plan: 0.1c-256mb
    region: virginia
    postgresMajorVersion: '17'
    diskSizeGB: 5
    storageAutoscalingEnabled: true
    ipAllowList: []

services:
  - type: web
    name: bigmedia-web
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health/
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bigmedia-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: 'false'
