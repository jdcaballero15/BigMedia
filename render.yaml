# Dos entornos (ADR-0005):
#   - producción: rama `main`, web y PostgreSQL pagos en Render, con copias de seguridad.
#   - staging: rama `develop`, web gratis en Render y base en Neon gratis (no vence a los 30 días).
#     La URL de Neon se carga a mano en el panel de Render (`DATABASE_URL`); nunca va a Git.
#     Staging arranca con datos de ejemplo (nunca datos reales).
# Límite del plan gratis de la web: se duerme tras 15 minutos sin tráfico.
databases:
  - name: bigmedia-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: '17'
    ipAllowList: []

services:
  - type: web
    name: bigmedia-web
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health/
    # La imagen migra al arrancar (backend/arrancar.sh).
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bigmedia-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: 'false'
      # Render los pide al crear el Blueprint; nunca se guardan en Git.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: bigmedia-web-staging
    runtime: docker
    plan: free
    region: virginia
    branch: develop
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health/
    envVars:
      # Connection string directa de Neon (sin `-pooler`, con `sslmode=require`).
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # `staging` endurece la seguridad como producción y carga datos de ejemplo al arrancar.
      - key: DJANGO_ENV
        value: staging
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Contraseña de los usuarios de demo (opcional; sin ella no se crean).
      - key: DJANGO_DEMO_PASSWORD
        sync: false
