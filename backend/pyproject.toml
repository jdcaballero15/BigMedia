[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bigmedia-api"
version = "0.1.0"
description = "API del sistema de reservas OOH de Big Media Argentina"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6",
    "dj-database-url>=2,<4",
    "djangorestframework>=3.16,<4",
    "gunicorn>=23,<25",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "whitenoise>=6,<8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]
